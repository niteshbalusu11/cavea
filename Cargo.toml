[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false
repository = "https://github.com/niteshbalusu11/cavea"

[workspace.dependencies]
# workspace crates
cavea-core = { path = "crates/cavea-core" }
cavea-format = { path = "crates/cavea-format" }
cavea-compiler = { path = "crates/cavea-compiler" }
cavea-render = { path = "crates/cavea-render" }
cavea-edit = { path = "crates/cavea-edit" }
cavea-engine = { path = "crates/cavea-engine" }
cavea-telemetry = { path = "crates/cavea-telemetry" }
cavea-testkit = { path = "crates/cavea-testkit" }

# third party
anyhow = "1"
# Default features off; each crate enables what it uses.
axum = { version = "0.8.9", default-features = false }
brotli = "9"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = "0.5.3"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "env-filter",
    "json",
] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = "1"
# Renderer: WebGL2 bindings at run time; WGSL to GLSL translation at build time only.
glow = { version = "0.18", default-features = false }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in", "glsl-out"] }
js-sys = { version = "0.3", default-features = false }
web-sys = { version = "0.3", default-features = false }
# The CLI support crate must match the wasm-bindgen version exactly.
wasm-bindgen = "=0.2.130"
wasm-bindgen-cli-support = "=0.2.130"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
# Keep debug builds quick to link; full debug info is rarely needed.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Profile for the browser WASM (cavea-web, later cavea-edit), built by
# `cargo xtask build-web`. opt-level 3 is both the fastest and, after
# `wasm-opt -Oz` and brotli, the smallest: 31,354 B against 32,846 B for "s"
# and 32,604 B for "z" on the first real renderer (docs/01-architecture.md §5).
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false
incremental = false
