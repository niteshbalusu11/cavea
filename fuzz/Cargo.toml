# Coverage-guided fuzz targets (docs/13-testing-benchmarks.md §5), built by
# `cargo fuzz` with the nightly toolchain of `nix develop .#fuzz`. Its own
# workspace, with its own lockfile and target directory: the main workspace,
# its `cargo build`, `clippy` and CI never see it.

[package]
name = "cavea-fuzz"
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
cavea-compiler = { path = "../crates/cavea-compiler" }
cavea-core = { path = "../crates/cavea-core" }
cavea-format = { path = "../crates/cavea-format" }
cavea-render = { path = "../crates/cavea-render" }
libfuzzer-sys = "0.4"
# The HTTP target (`http_api`): the server's router in process, with the
# router tests' OpenAPI check (feature `fuzzing`), over a database of its own.
# Each at the main workspace's version, already in its tree.
axum = { version = "0.8.9", default-features = false }
cavea-server = { path = "../crates/cavea-server", features = ["fuzzing"] }
# The server's licence state, as its router tests make it (no licence).
cavea-licence = { path = "../crates/cavea-licence" }
cavea-telemetry = { path = "../crates/cavea-telemetry" }
# Signs the session tokens the requests carry (08 §11).
hmac = { version = "0.13.0", default-features = false }
# `atexit`, to drop the run's database when libFuzzer exits.
libc = { version = "0.2.191", default-features = false }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }
# Creating and dropping the run's database.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "time"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[dev-dependencies]
cavea-testkit = { path = "../crates/cavea-testkit" }

# `cargo fuzz` builds with `--release`: keep the checks the shipped build
# leaves out, so an overflow or a failed debug assertion is a finding.
[profile.release]
debug-assertions = true
overflow-checks = true

[[bin]]
name = "ccf_decode"
path = "fuzz_targets/ccf_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "document_parse"
path = "fuzz_targets/document_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_apply"
path = "fuzz_targets/snapshot_apply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_api"
path = "fuzz_targets/http_api.rs"
test = false
doc = false
bench = false
