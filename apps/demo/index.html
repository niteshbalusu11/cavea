<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cavea demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          14px system-ui,
          sans-serif;
      }
      /* The map fills the window; the status sits on top of it, so text
         changes never resize the map. */
      #map {
        position: fixed;
        inset: 0;
      }
      /* Cooperative mode: the map sits in a page that scrolls. */
      .scrolling #map {
        position: relative;
        height: 80vh;
      }
      /* A second map from `caveaDemo.second()`. */
      #second {
        position: fixed;
        right: 1em;
        bottom: 5em;
        width: 30vw;
        height: 30vh;
        z-index: 1;
      }
      .scrolling::after {
        content: "";
        display: block;
        height: 150vh;
      }
      output {
        position: fixed;
        left: 0;
        padding: 0.5em;
        white-space: pre;
        background: rgb(255 255 255 / 0.85);
        z-index: 1;
        pointer-events: none;
      }
      #status {
        top: 0;
      }
      #selection {
        bottom: 0;
      }
      [data-theme="dark"] output,
      [data-theme="high-contrast"] output {
        color: #fff;
        background: rgb(0 0 0 / 0.75);
      }
      @media (prefers-color-scheme: dark) {
        [data-theme="auto"] output {
          color: #fff;
          background: rgb(0 0 0 / 0.75);
        }
      }
    </style>
  </head>
  <body>
    <output id="status">Loading…</output>
    <output id="selection"></output>
    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
