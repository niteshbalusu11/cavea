# Local services for development. One shared PostgreSQL for every agent and
# developer on the machine; tests create and drop their own databases.
#   docker compose -f deploy/compose.yaml up -d --wait
name: cavea

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cavea
      POSTGRES_PASSWORD: cavea
      POSTGRES_DB: cavea
    ports:
      - "127.0.0.1:${CAVEA_PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP, as the server connects: on its first start PostgreSQL runs
      # a set-up server that answers on its socket only, then restarts.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cavea -d cavea"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
