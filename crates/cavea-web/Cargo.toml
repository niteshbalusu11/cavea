[package]
name = "cavea-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Debug-only exports for apps/demo: synthetic charts compiled in the browser,
# seat status and camera setters. `cargo xtask build-web` leaves it off, so the
# production WASM has neither the compiler nor the generator;
# `cargo xtask build-web --demo` turns it on.
demo = ["dep:cavea-testkit", "dep:cavea-compiler", "cavea-render/demo"]

[dependencies]
wasm-bindgen.workspace = true
# Natively too, for the event encoder's test; the `glow` backend is wasm32 only.
cavea-render.workspace = true
cavea-compiler = { workspace = true, optional = true }
cavea-testkit = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cavea-render = { workspace = true, features = ["glow"] }
glow.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "CssStyleDeclaration",
  "HtmlCanvasElement",
  "HtmlElement",
  "WebGl2RenderingContext",
  "WebGlContextAttributes",
  "WebGlPowerPreference",
] }

[lints]
workspace = true
