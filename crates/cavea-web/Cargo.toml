[package]
name = "cavea-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Debug-only exports for apps/demo (synthetic seats). `cargo xtask build-web`
# leaves it off; `cargo xtask build-web --demo` turns it on.
demo = ["dep:cavea-testkit"]

[dependencies]
wasm-bindgen.workspace = true
cavea-testkit = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cavea-render = { workspace = true, features = ["glow"] }
glow.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "CssStyleDeclaration",
  "HtmlCanvasElement",
  "HtmlElement",
  "WebGl2RenderingContext",
  "WebGlContextAttributes",
  "WebGlPowerPreference",
] }

[lints]
workspace = true
