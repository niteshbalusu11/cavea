[package]
name = "cavea-loadgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The server load generator (docs/13-testing-benchmarks.md §7.1): simulated
# buyers and a backend against a running `cavea-server`, over its real network
# API. Every dependency is already in the workspace's tree; it adds no crate.
[dependencies]
anyhow.workspace = true
# Realtime frames and the compiled chart's rows, as clients decode them.
cavea-format.workspace = true
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync", "io-util"] }
# The WebSocket client, at the version axum's `ws` feature already builds;
# `handshake` only: the generator opens and binds its own sockets.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }

[dev-dependencies]
# A chart document for the live test.
cavea-testkit.workspace = true
# Paused time for the open-loop schedule's test.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
