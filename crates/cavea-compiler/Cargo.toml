[package]
name = "cavea-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# BLAKE3-128 content hash of each artefact (03 §4.1); portable Rust, no C.
blake3 = { workspace = true }
cavea-core.workspace = true
cavea-format.workspace = true
# Fill and stroke tessellation of section outlines and shapes (03 §3.1 step 12).
lyon_tessellation.workspace = true
serde.workspace = true
# Exact float parsing so a document saved after loading keeps every coordinate.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
