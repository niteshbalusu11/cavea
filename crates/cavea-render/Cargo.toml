[package]
name = "cavea-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The WebGL2 backend. Enabled by `cavea-web` for wasm32 only, so native builds of
# the workspace never compile it.
glow = ["dep:glow"]
# Debug-only entry points for apps/demo and tests: `Engine::set_status`.
demo = []

[dependencies]
cavea-core.workspace = true
cavea-format.workspace = true
glow = { workspace = true, optional = true }

[dev-dependencies]
cavea-compiler.workspace = true
cavea-testkit.workspace = true

[build-dependencies]
naga.workspace = true

[lints]
workspace = true
