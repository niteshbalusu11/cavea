[package]
name = "cavea-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# argon2id for console passwords (09 §2, 12 §3 T9): the hash itself, without
# the PHC string crate (the server writes and reads that form itself).
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
# `query` adds serde_urlencoded, for the problem+json `Query` extractor. `ws`
# adds tokio-tungstenite and tungstenite for the realtime WebSocket (08 §8).
axum = { workspace = true, features = ["tokio", "http1", "json", "matched-path", "query", "ws"] }
# The SSE stream's base64 `data:` lines; already in the tree through sqlx-postgres.
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
# BLAKE3, the content hash of uploaded assets as of chart artefacts (03 §4.1);
# already built for cavea-compiler.
blake3.workspace = true
# Brotli (quality 11) of each published chart's public artefact (03 §4.6); the
# workspace's version, already built for xtask.
brotli.workspace = true
# Parses, validates and compiles chart drafts (03 §3); its dependencies are
# already in the workspace.
cavea-compiler.workspace = true
# The object limit, and the full-artefact decoder and label composition for
# the chart provider; both already built for cavea-compiler.
cavea-core.workspace = true
cavea-engine.workspace = true
cavea-format.workspace = true
# The licence file's format and its verification (12 §7.2, D-80): its crates
# (ring, base64, serde_json) are already in the tree.
cavea-licence.workspace = true
cavea-telemetry.workspace = true
# The secure random source for API keys; already in the tree through sqlx-postgres.
getrandom = { version = "0.4.3", default-features = false }
# Request and response bodies; `derive` adds serde_derive (its syn is in the tree).
serde = { version = "1", default-features = false, features = ["derive"] }
# `raw_value` (already on through axum's `json`) takes a draft as uploaded.
serde_json = { workspace = true, features = ["raw_value"] }
# The SSE response body's frame type; already in the tree through axum.
http-body = "1.1.0"
# HMAC-SHA-256 of session tokens (08 §11); already in the tree through sqlx-postgres.
hmac = { version = "0.13.0", default-features = false }
# SHA-256 of API keys and the admin key; already in the tree through sqlx-postgres.
sha2 = { version = "0.11.1", default-features = false }
# HMAC-SHA-1 for the console's second factor (RFC 6238 TOTP, 09 §2); already
# in the tree through rustls and cavea-licence, so it adds no crate.
ring = { version = "0.17.14", default-features = false }
# Runtime queries only (no `macros`: they need a database or offline data at
# build time); `migrate` adds no crates; one TLS backend for managed PostgreSQL.
sqlx = { workspace = true, features = [
  "runtime-tokio",
  "postgres",
  "migrate",
  "tls-rustls-ring-webpki",
] }
# Constant-time comparison of the admin key; already in the tree through rustls.
subtle = { version = "2.6.1", default-features = false }
# `time` for the commit and compile timeouts; `sync` (already built for
# cavea-engine) for the compile permits.
tokio = { workspace = true, features = ["time", "sync"] }
# `Layer` and `Service` for the panic layer; already built for axum.
tower.workspace = true
tracing.workspace = true
# The WebSocket's error type, to tell an oversized message from a broken
# connection; the version axum's `ws` already builds.
tungstenite = { version = "0.29.0", default-features = false }

# `sched_setscheduler`, to run the realtime runtime's threads under
# `SCHED_IDLE` (08 §8.3); already in the tree through tokio.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.191", default-features = false }

[features]
# A test build that also trusts the public key in `CAVEA_TEST_LICENCE_KEY` at
# compile time, for trying licences by hand (D-80). Debug builds only: with
# `--release` it fails to compile; `cargo xtask build-server`, the image and
# CI build without it.
trust-test-key = []
# Exposes `http::openapi::check` to the HTTP fuzz target (`fuzz/`,
# docs/13-testing-benchmarks.md §5). Off in every build of the server.
fuzzing = []

[dev-dependencies]
# Tests sign their own licences with keys made at run time.
cavea-licence = { workspace = true, features = ["sign"] }
cavea-testkit.workspace = true
# `SinkExt` and `StreamExt` for that client; already built for axum.
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
# Paused time for the realtime timers' tests; no crate beyond tokio's own.
tokio = { workspace = true, features = ["test-util"] }
# A WebSocket client for the realtime tests: the crate axum's `ws` already
# builds, with its client handshake (also already built).
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
