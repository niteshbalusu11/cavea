[package]
name = "cavea-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["tokio", "http1", "json", "matched-path"] }
cavea-engine.workspace = true
cavea-telemetry.workspace = true
# The bound on the JSON extractor; already in the tree through serde_json.
serde = { version = "1", default-features = false }
serde_json.workspace = true
# Runtime queries only (no `macros`: they need a database or offline data at
# build time); `migrate` adds no crates; one TLS backend for managed PostgreSQL.
sqlx = { workspace = true, features = [
  "runtime-tokio",
  "postgres",
  "migrate",
  "tls-rustls-ring-webpki",
] }
# `time` for the commit timeout.
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
