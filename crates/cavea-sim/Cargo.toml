[package]
name = "cavea-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The seat engine's reference model, model-based tests and deterministic
# simulation (docs/13-testing-benchmarks.md §3.1, §3.2). A crate of its own so
# that the engine's own test builds do not compile it, and so that later test
# tools (the reconciler, the load generator) can reuse the model and its log
# replay.
[dependencies]
cavea-engine.workspace = true
# Decoding the frames simulated subscribers receive.
cavea-format.workspace = true
# As the engine's: a current-thread runtime per simulated node.
tokio = { version = "1.54", default-features = false, features = ["sync", "rt"] }

[lints]
workspace = true
