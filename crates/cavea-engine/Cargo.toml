[package]
name = "cavea-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cavea-format.workspace = true
# Not the workspace entry: that one enables the server's runtime features. The
# engine needs channels, and `rt` for the registry to run each event's load
# and actor as a task of its own.
tokio = { version = "1.54", default-features = false, features = ["sync", "rt"] }
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1.54", default-features = false, features = ["sync", "rt", "macros"] }

[lints]
workspace = true
