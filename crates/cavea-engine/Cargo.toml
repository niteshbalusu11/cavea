[package]
name = "cavea-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Not the workspace entry: that one enables the server's runtime features; the
# engine only needs channels.
tokio = { version = "1.54", default-features = false, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1.54", default-features = false, features = ["sync", "rt", "macros"] }

[lints]
workspace = true
