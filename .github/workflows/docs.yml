# The public documentation site's build check (D-83): Markdown pages, the API
# reference generated from the OpenAPI document, its link and error-reference
# checks. ci.yml builds it too, with everything else, but ignores changes to
# Markdown alone; this runs for those. No install: the build has no
# dependencies beyond bun.
name: Docs

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "CHANGELOG.md"
      - "crates/cavea-server/openapi.json"
      - "crates/cavea-server/src/**"
      - "crates/cavea-engine/src/types.rs"
      - "apps/console/src/designer/templates/theatre.json"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "CHANGELOG.md"
      - "crates/cavea-server/openapi.json"
      - "crates/cavea-server/src/**"
      - "crates/cavea-engine/src/types.rs"
      - "apps/console/src/designer/templates/theatre.json"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun apps/docs/src/build.ts
