# Format, lint, type and build checks only. Test suites run locally before a
# pull request is filed (see AGENTS.md, "Continuous integration").
name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain, components and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # Caches ~/.cargo and target/, keyed on the toolchain and Cargo.lock.
      # Only main writes the cache so pull requests never evict it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      # The fuzz crate (fuzz/: its own workspace and lockfile, fuzzed on
      # nightly with cargo-fuzz) type-checks on the pinned stable toolchain:
      # a change to an API its targets use fails here, not at the next run
      # (docs/13-testing-benchmarks.md §5, D-86).
      # Not --locked: a dependency the workspace adds is resolved here
      # rather than failing every pull request until fuzz/Cargo.lock follows.
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --target-dir target/fuzz
      - run: cargo xtask check-deps
      # wasm-opt for build-web's payload gate: binaryen 132, the version
      # flake.nix provides. The gate refuses a build without it or with
      # another version, whose sizes are not comparable with the baseline.
      - name: Install binaryen 132
        run: |
          curl -sSfL -o "$RUNNER_TEMP/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz
          echo "195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP" binaryen-version_132/bin/wasm-opt
          echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"
      # The gate also bundles @cavea/renderer's public entry with bun (no
      # install: the package has no dependencies), so it measures the whole
      # payload: SDK and glue, WASM, atlas.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The wasm32 build of cavea-web plus bindings; the web job consumes the output.
      - run: cargo xtask build-web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-wasm
          path: packages/renderer/wasm/
          retention-days: 1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: renderer-wasm
          path: packages/renderer/wasm/
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run build
